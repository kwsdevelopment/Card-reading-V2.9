name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the app zip (if the files were uploaded as a zip)
        run: |
          if [ ! -f package.json ]; then
            unzip -o -q ./*.zip
          fi
          if [ ! -f package.json ]; then
            f=$(find . -name package.json -not -path "./node_modules/*" | head -1)
            d=$(dirname "$f")
            cp -r "$d"/. .
          fi
          ls -la

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        run: npm install

      - name: Create the Android project
        run: npx cap add android

      - name: Camera permission, icons
        run: python3 scripts/patch_android.py

      - name: Copy the web app into Android
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CardReader-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
